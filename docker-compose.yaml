name: dsh-container

services:
  dsh:
    image: ${DSH_CONTAINER_IMAGE:-dsh-container}:${DSH_CONTAINER_DSH_VERSION:-latest}
    build:
      context: .
      args:
        DSH_CONTAINER_DSH_VERSION: ${DSH_CONTAINER_DSH_VERSION:-latest}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DSH_CONTAINER_BIND_ADDRESS:-127.0.0.1}:${DSH_CONTAINER_PORT:-3080}:${DSH_CONTAINER_RELAY_PORT:-3080}"
    env_file:
      - .env
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_PERMISSION_MODE: danger-full-access
      DSH_TELEMETRY_DISABLED: "1"
      DSH_CONTAINER_TRUSTED_HOSTS: ${DSH_CONTAINER_TRUSTED_HOSTS:?请在 .env 中设置 DSH_CONTAINER_TRUSTED_HOSTS}
      DSH_CONTAINER_PUBLIC_URL: ${DSH_CONTAINER_PUBLIC_URL:-}
      NODE_USE_ENV_PROXY: "1"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ./workspace
        target: /home/node
      - type: bind
        source: ./.dsh
        target: /home/node/.dsh
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - /usr/local/lib/dsh-container/healthcheck.mjs
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
